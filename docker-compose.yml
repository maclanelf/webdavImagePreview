# Docker Compose 配置文件
# 使用命令: docker compose up -d

services:
  webdav-image-preview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    # 飞牛应用图标相关配置
    labels:
      watchcow.enable: "true"
      watchcow.appname: "WIP"   # 对应前面的应用名
      watchcow.service_port: "3001"   # 和前面的端口名对应
      watchcow.protocol: "http"
      watchcow.path: "/"
      watchcow.icon: "/vol1/1000/project/webdavImagePreview/webdav.png"   # 这里替换成你自己的图标库
      # watchcow.icon: "https://example.com/libretv.png"     # 这里也可以改成在线图标，把前面注释掉就行了
      watchcow.all_users: "false"          # 普通用户直接看不到图标,管理员可以看见
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=Asia/Shanghai
      # WebDAV 配置 (可选，也可以通过应用界面配置)
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - WEBDAV_MEDIA_PATH=${WEBDAV_MEDIA_PATH:-}
    volumes:
      # 数据持久化 - SQLite 数据库和评分数据（映射到宿主机）
      - /vol1/1000/webdavimagepreview/app-data:/app/data
      # 应用日志文件（映射到宿主机）
      - /vol1/1000/webdavimagepreview/app-logs:/app/logs
      # Nginx 日志文件（映射到宿主机）
      - /vol1/1000/webdavimagepreview/nginx-logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 注释掉 volumes 定义，因为现在使用宿主机目录映射
# volumes:
#   webdav_data:
#     driver: local
#   webdav_logs:
#     driver: local
